server:
  port: 8080
  # 手机通过局域网访问电脑后端时可保留；使用 adb reverse 时也不会有副作用。
  address: 0.0.0.0

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/bianjie
    driver-class-name: org.postgresql.Driver
    username: postgres
    password: your-postgres-password
  h2:
    console:
      enabled: false
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration/postgresql

bianjie:
  catalog:
    admin-enabled: true
  ai:
    gateway:
      provider: openai-compatible
      default-model-id: glm-5v-turbo
      timeout-seconds: 120
      models:
        - id: glm-5v-turbo
          name: GLM-5V Turbo
          description: 当前真实接入的 GLM 多模态模型。
          provider: glm
          base-url: https://open.bigmodel.cn/api/paas/v4
          api-key: ${GLM_API_KEY:your-glm-api-key}
          model: glm-5v-turbo
          default-model: true
          sort-order: 1
        - id: qwen-image-2.0
          name: Qwen Image 2.0
          description: 用于设计图生成与参考图改写的 DashScope 图像模型。
          provider: dashscope
          base-url: ${DASHSCOPE_BASE_URL:https://your-workspace.cn-beijing.maas.aliyuncs.com/api/v1}
          api-key: ${DASHSCOPE_API_KEY:your-workspace-api-key}
          model: qwen-image-2.0
          timeout-seconds: 180
          sort-order: 20
