name: 工具开发申请 / Tool Development Request
description: 申请开发 1-3 个同能力族工具，由管理员确认后再创建个人分支。
title: '[Tool] '
labels:
  - tool-request
body:
  - type: markdown
    attributes:
      value: |
        提交前请阅读 `AGENTS.md`。一次申请最多包含 3 个同能力族工具。管理员确认 `toolId`、executor/operation、公共文件占用和数据库迁移后才能开始编码。

        Read `AGENTS.md` before submitting. One request may contain at most three tools from the same capability family. Coding starts only after administrator approval.

  - type: input
    id: owner
    attributes:
      label: 开发者 / Developer
      description: GitHub 用户名和姓名。
      placeholder: '@username / 张三'
    validations:
      required: true

  - type: dropdown
    id: tab
    attributes:
      label: 所属 Tab / Target Tab
      options:
        - 功能 / Tools
        - 写作 / Writing
        - 首页 / Home
    validations:
      required: true

  - type: input
    id: category
    attributes:
      label: 分类 / Category
      placeholder: PDF 操作 / 图像生成 / 文章创作
    validations:
      required: true

  - type: textarea
    id: tools
    attributes:
      label: 工具清单 / Tool List
      description: 每行一个工具，最多 3 个；写明中文名、建议 toolId 和真实可用目标。
      placeholder: |
        1. PDF 合并 | pdf-merge | 真实合并并输出 PDF
        2. PDF 分割 | pdf-split | 真实分割并输出多个 PDF
    validations:
      required: true

  - type: dropdown
    id: executor
    attributes:
      label: 计划复用的能力族 / Planned Executor
      options:
        - llm-template
        - image-generation
        - document-processing
        - ppt-generation
        - external-api
        - workflow
        - placeholder
        - 待架构确认 / Architecture review required
    validations:
      required: true

  - type: textarea
    id: operations
    attributes:
      label: Operation 设计 / Planned Operations
      description: 为每个工具填写稳定英文 operation；llm-template 可说明不需要。
      placeholder: pdf-merge, pdf-split
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: 对标截图与功能说明 / Reference Screenshots and Behavior
      description: 拖入详情页截图，并说明必须实现的输入、附件、参数和输出。
      placeholder: 上传截图并列出关键交互；请先遮挡隐私和账号信息。
    validations:
      required: true

  - type: textarea
    id: shared_files
    attributes:
      label: 预计修改的公共能力 / Shared Files or Capabilities
      description: 执行器、动态表单、协议 DTO、路由、历史记录、附件等。
      placeholder: DocumentProcessingToolExecutor, tool_runner_page.dart
    validations:
      required: true

  - type: dropdown
    id: database_change
    attributes:
      label: 是否涉及数据库结构或数据迁移 / Database Migration Required
      options:
        - 否 / No
        - 是，需要新表 / Yes, new table
        - 是，需要字段、索引或约束 / Yes, columns, indexes, or constraints
        - 是，需要配置数据迁移 / Yes, configuration data migration
        - 不确定 / Unsure
    validations:
      required: true

  - type: textarea
    id: database_details
    attributes:
      label: 数据库变更说明 / Database Change Details
      placeholder: 新增 tool_artifacts 表；开发阶段迁移待管理员确认最终时间戳。

  - type: textarea
    id: acceptance
    attributes:
      label: 验收标准 / Acceptance Criteria
      placeholder: |
        - 支持上传 2-5 个 PDF
        - 合并后可预览、保存并从历史记录重新打开
        - 非 PDF、超限和引擎失败有明确提示
    validations:
      required: true

  - type: checkboxes
    id: confirmation
    attributes:
      label: 开发确认 / Confirmation
      options:
        - label: 我已阅读 AGENTS.md，且本申请不超过 3 个工具。
          required: true
        - label: 我不会直接向 main 提交，会在管理员确认后创建个人分支。
          required: true
        - label: 我不会提交 API Key、本地配置、生成文件或用户数据。
          required: true
