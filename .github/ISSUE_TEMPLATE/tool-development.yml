name: 工具开发申请 / Tool Development Request
description: 申请开发同一 Tab、同一分类、同一能力族的 1-3 个工具，由管理员确认后再创建个人分支。
title: '[Tool] '
labels:
  - tool-request
body:
  - type: markdown
    attributes:
      value: |
        提交前请阅读 `AGENTS.md` 和 `docs/developer-tool-workflow.zh-CN.md`。一次申请最多包含同一 Tab、同一分类、同一能力族的 3 个工具。多张截图必须逐一说明各自对应哪个工具和要实现的真实功能。

        **开发者不需要预先懂 executor、operation、公共文件或 Flyway。** 请先把对标截图、目标行为和验收标准交给 AI，让 AI 读取 `docs/shared-tool-table-fields.zh-CN.md`，只分析代码和架构、不编码，并生成本 Issue 草稿。AI 生成候选 toolId 后，开发者必须自行查询 PostgreSQL 完成查重，再提交 Issue。无法确定的字段填写“待 AI/管理员确认”，由管理员批准后才能开始编码。

        Read `AGENTS.md` before submitting. One request may contain at most three tools from the same capability family. Coding starts only after administrator approval.

  - type: input
    id: owner
    attributes:
      label: 开发者 / Developer
      description: GitHub 用户名和姓名。
      placeholder: '@username / 张三'
    validations:
      required: true

  - type: dropdown
    id: tab
    attributes:
      label: 所属 Tab / Target Tab
      options:
        - 功能 / Tools
        - 写作 / Writing
        - 首页 / Home
    validations:
      required: true

  - type: input
    id: category
    attributes:
      label: 分类 / Category
      placeholder: PDF 操作 / 图像生成 / 文章创作
    validations:
      required: true

  - type: textarea
    id: tools
    attributes:
      label: 工具清单 / Tool List
      description: 每行一个工具，最多 3 个；写明截图编号、中文名、现有/建议 toolId 和真实可用目标。
      placeholder: |
        1. 截图 1 | PDF 合并 | pdf-merge | 真实合并并输出 PDF
        2. 截图 2 | PDF 分割 | pdf-split | 真实分割并输出多个 PDF
    validations:
      required: true

  - type: textarea
    id: tool_id_check
    attributes:
      label: toolId 开发者查重结果 / Developer Tool ID Check
      description: AI 只生成候选 ID，不执行查重。开发者提交 Issue 前必须自行查询 PostgreSQL tools.id，逐个说明是数据库未发现、复用现有工具 ID，还是发生冲突后已重新命名。管理员另行检查共享表占用。
      placeholder: |
        1. PDF 合并：候选 pdf-merge
           - PostgreSQL tools.id：未发现重复 / 已存在且为同一占位工具，决定复用
        2. PDF 分割：候选 pdf-split
           - PostgreSQL tools.id：原候选冲突；已改为 pdf-file-split 并复查无重复
    validations:
      required: true

  - type: dropdown
    id: executor
    attributes:
      label: 计划复用的能力族 / Planned Executor
      description: 不确定时选择“待架构确认”，禁止凭感觉新建执行器。
      options:
        - llm-template
        - image-generation
        - document-processing
        - ppt-generation
        - external-api
        - workflow
        - placeholder
        - 待架构确认 / Architecture review required
    validations:
      required: true

  - type: textarea
    id: operations
    attributes:
      label: Operation 设计 / Planned Operations
      description: 优先填写 AI 阅读代码后的建议；仍不确定时填写“待 AI/管理员确认”。llm-template 可说明不需要。
      placeholder: pdf-merge, pdf-split；或：待 AI/管理员确认
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: 对标截图与功能说明 / Reference Screenshots and Behavior
      description: 拖入详情页截图，并说明必须实现的输入、附件、参数和输出。
      placeholder: 上传截图并列出关键交互；请先遮挡隐私和账号信息。
    validations:
      required: true

  - type: textarea
    id: shared_files
    attributes:
      label: 预计修改的公共能力 / Shared Files or Capabilities
      description: 由 AI 阅读代码后列出执行器、动态表单、协议 DTO、路由、历史记录、附件等；不确定时明确填写待确认。
      placeholder: DocumentProcessingToolExecutor, tool_runner_page.dart；或：待 AI/管理员确认
    validations:
      required: true

  - type: dropdown
    id: database_change
    attributes:
      label: 是否涉及数据库结构或数据迁移 / Database Migration Required
      options:
        - 否 / No
        - 是，需要新表 / Yes, new table
        - 是，需要字段、索引或约束 / Yes, columns, indexes, or constraints
        - 是，需要配置数据迁移 / Yes, configuration data migration
        - 不确定 / Unsure
    validations:
      required: true

  - type: textarea
    id: database_details
    attributes:
      label: 数据库变更说明 / Database Change Details
      placeholder: 新增 tool_artifacts 表；开发阶段迁移待管理员确认最终时间戳。

  - type: textarea
    id: shared_task_record
    attributes:
      label: 共享任务表记录草稿 / Shared Task Record Draft
      description: 一个合规 Issue 默认对应且只对应 1 条任务记录（一个负责人、一个分支、一个 PR）。多个工具在同一单元格分行列出；若需要多条任务记录，应拆分 Issue。
      placeholder: |
        记录数量：1
        Task ID：待管理员分配
        Owner：@username / 姓名
        Tab / 分类：功能 / PDF 操作
        Tools：PDF 合并；PDF 分割
        toolIds：pdf-merge；pdf-split
        executor / operations：document-processing / pdf-merge；pdf-split
        Branch：待管理员批准
        Shared Ownership：DocumentProcessingToolExecutor；artifact/history
        Database / Flyway：是否迁移及目的
        PR：-
        Status：需求确认
        Updated：提交日期
    validations:
      required: true

  - type: textarea
    id: shared_migration_records
    attributes:
      label: 共享迁移占用表记录草稿 / Shared Migration Records Draft
      description: 迁移记录数量等于本 Issue 计划新增的 Flyway SQL 文件数量，不等于工具数量。无迁移填 0 条和原因；一个迁移文件填 1 条；多个迁移文件逐条填写并说明依赖顺序。最终时间戳由管理员在合并顺序明确后批准。
      placeholder: |
        记录数量：0 / 1 / N

        无迁移示例：
        记录数量：0
        原因：复用现有 tools、tool_runs 和 artifact 结构，仅通过管理 API 更新配置。

        有迁移示例：
        记录数量：1
        Task ID：待管理员分配
        Owner：@username / 姓名
        Purpose：更新 pdf-merge 和 pdf-split 的工具配置
        Draft File：docs/migration-drafts/<TASK>__configure_pdf_tools.sql
        Final Migration：待管理员批准
        Depends On：当前最新迁移 / 待管理员确认
        Applied to Shared DB：否
        Status：Draft
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: 验收标准 / Acceptance Criteria
      placeholder: |
        - 支持上传 2-5 个 PDF
        - 合并后可预览、保存并从历史记录重新打开
        - 非 PDF、超限和引擎失败有明确提示
    validations:
      required: true

  - type: checkboxes
    id: confirmation
    attributes:
      label: 开发确认 / Confirmation
      options:
        - label: 我已阅读 AGENTS.md，且本申请不超过 3 个工具。
          required: true
        - label: 我不会直接向 main 提交，会在管理员确认后创建个人分支。
          required: true
        - label: 我不会提交 API Key、本地配置、生成文件或用户数据。
          required: true
