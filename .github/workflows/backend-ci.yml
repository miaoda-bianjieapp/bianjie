name: Backend CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect backend changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect relevant paths
        id: filter
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" || -z "$BASE_SHA" || "$BASE_SHA" == "0000000000000000000000000000000000000000" ]]; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --quiet "$BASE_SHA" HEAD -- apps/api-java .github/workflows/backend-ci.yml AGENTS.md; then
            echo "backend=false" >> "$GITHUB_OUTPUT"
          else
            echo "backend=true" >> "$GITHUB_OUTPUT"
          fi

  test-and-package:
    name: Java 17 test and package
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/api-java
    env:
      BIANJIE_AI_GATEWAY_PROVIDER: mock

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17 and Maven cache
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: apps/api-java/pom.xml

      - name: Verify Java and Maven
        run: |
          java -version
          mvn -version

      - name: Run backend tests
        run: mvn --batch-mode --no-transfer-progress test

      - name: Package backend
        run: mvn --batch-mode --no-transfer-progress -DskipTests package

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: apps/api-java/target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7

  backend-ci-result:
    name: Backend CI result
    if: always()
    needs:
      - changes
      - test-and-package
    runs-on: ubuntu-latest
    steps:
      - name: Require relevant backend checks
        shell: bash
        env:
          RELEVANT: ${{ needs.changes.outputs.backend }}
          TEST_RESULT: ${{ needs.test-and-package.result }}
        run: |
          if [[ "$RELEVANT" != "true" ]]; then
            echo "No backend changes; backend checks are not required for this PR."
            exit 0
          fi
          if [[ "$TEST_RESULT" != "success" ]]; then
            echo "Backend test/package job result: $TEST_RESULT"
            exit 1
          fi
          echo "Backend checks passed."
